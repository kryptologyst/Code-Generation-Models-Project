# CodeGen Code Generation Configuration
model:
  type: "codegen"
  name: "Salesforce/codegen-350M-mono"
  max_length: 512
  temperature: 0.7
  top_p: 0.9
  top_k: 50

training:
  batch_size: 2
  learning_rate: 2e-5
  num_epochs: 3
  warmup_steps: 100
  weight_decay: 0.01
  gradient_clip_val: 1.0
  accumulate_grad_batches: 4

data:
  train_path: "data/train.json"
  val_path: "data/val.json"
  test_path: "data/test.json"
  max_length: 512
  num_workers: 0

evaluation:
  metrics: ["bleu", "rouge1", "rouge2", "rougeL", "code_bleu", "execution_success", "diversity"]
  k_values: [1, 5, 10]

logging:
  log_dir: "logs"
  log_level: "INFO"
  use_wandb: false
  wandb_project: "code-generation"

device:
  auto: true
  seed: 42

output:
  checkpoint_dir: "assets/checkpoints"
  sample_dir: "assets/samples"
  results_dir: "assets/results"
